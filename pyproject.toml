[project]
name = "office-terminal"
version = "0.1.0"
description = "事務所の退室点検端末"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28.1",
    "jinja2>=3.1,<4.0",
    "psutil>=6,<8",
    "python-multipart>=0.0.32",
    "qrcode>=8,<9",
    "uvicorn>=0.30,<1.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/office_terminal"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
