# TOP画面の天気欄の設定。編集後はアプリを再起動すると反映されます。
# コードの調べ方は README の「天気欄」を参照してください。
[weather]
# 画面に表示する名前だけです。この値を変えても取得地域は変わりません。
display_name = "福岡地方"
# 気象庁の府県予報区コード（取得するJSONの選択）。福岡県 = 400000
office_code = "400000"
# 天気・降水確率に使う予報区（一次細分区域）コード。福岡地方 = 400010
weather_area_code = "400010"
# 最高・最低気温に使う地点コード。福岡 = 82182
temperature_point_code = "82182"
